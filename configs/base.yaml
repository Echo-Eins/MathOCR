# Single source of truth for one experiment: data version, preprocessing,
# model and training.  Seeds are passed on the command line (--seed).

data:
  out_dir: data/processed
  cache_dir: ~/.cache/mathocr
  oleehyo_shards: [0, 1, 2, 3, 4, 5]
  oleehyo_train_size: 150000
  oleehyo_val_permille: 15
  oleehyo_test_permille: 15
  max_tokens: 254          # model.max_len - BOS - EOS
  train_max_tokens: null   # train-only limit (default = max_tokens); val/test always keep max_tokens
  min_token_freq: 10
  min_fit_ratio: 0.6       # drop train images that must shrink below 0.6x glyph target to fit
  workers: 4

image:
  target_glyph_px: 14.0
  max_h: 192
  max_w: 768
  margin: 8
  multiple: 32
  min_scale: 0.1
  max_scale: 4.0

model:
  cnn_channels: [64, 128, 256, 384]
  cnn_blocks: [2, 2, 2, 2]
  d_model: 512
  n_heads: 8
  enc_layers: 3
  dec_layers: 6
  ff_mult: 4
  dropout: 0.1
  max_len: 256
  encoder: transformer     # transformer | aas | aas_sort (linear-cost global mixers) | triscan (TriScanBlock first), model.py
  triscan_streams: hv      # triscan: h (row scans both ways), v (whole-height conv), d (both diagonals); hv = base B2
  triscan_exchange: false  # triscan: v/d start-middle-end anchors modulate the row scans; rounds of exchange
  triscan_rounds: 2
  local_expansion: 1.5     # AAS local residual width (12 d^2 per block, same as a Transformer layer)
  sort_window: 32
  attn_kernel: sdpa        # sdpa | triton (fused deterministic attention for long key sets, attn_kernel.py)
  count_head: false        # symbol-count head on the encoder memory (needs train.count_loss > 0)
  count_feed: false        # CAN-style: predicted counts fed to every decoder input (needs count_head)
  ring_bias: false          # decoder layer l: ring x direction bias around layer l-1's attention focus
  coverage: false           # decoder layer l: penalty on cells layer l-1 read at earlier steps
  feedback_rings: 6
  deform_layers: 0          # top decoder layers that also read fine CNN maps at ring points around their focus
  enc_stride: 16x8          # encoder output stride: 16x8 | 8x8 | 8x4 (more memory cells per glyph)
  bidir: false              # BTTR: also trained on reversed targets (direction embedding); R2L rescoring
  rings: false             # ring branches (dilations 1-8) after CNN stages 2-4
  inject: false            # raw-image pyramid injected after every CNN stage
  depth_pos: false         # brace depth as an extra decoder position
  coarse: 1                # encoder input average-pooled by this factor (fovea still reads full resolution)
  fovea: false             # foveal ring reader (ring CNN glimpses from decoder layer fovea_layer on)
  fovea_layer: 3
  fovea_levels: 5
  fovea_size: 8
  fovea_base: 2.0
  fovea_channels: 64
  head: tied               # tied | cells (an MLP per vocabulary cell + all-to-all cell links) | cells_ml | cells_vis
  head_k: 16               # hidden units per vocabulary cell
  attn_gate: none          # none | head | elem: sigmoid gate on every attention output (zero-init: half output)
  qk_norm: false           # RMSNorm of queries and keys per head (learned gains)
  value_residual: false    # decoder self-attention values of layers >= 1 mixed with layer 0's (learned share)
  cnn_blur: false          # anti-aliased CNN downsampling: stride-1 convolution, binomial low-pass, subsample (BlurPool)
  dense_memory: false      # every decoder layer reads its own mix of all encoder levels (zero-init gains: plain memory)
  fine_memory: false       # the CNN's stride-4 map joins every cross-attention as extra keys, past the encoder

augment:
  scale_log_range: 0.29    # glyph-size jitter exp(U(-r, r)) = 0.75x .. 1.34x
  p_blur: 0.25
  blur_sigma: [0.3, 0.9]
  p_stroke: 0.25
  p_contrast: 0.3
  p_noise: 0.25
  noise_std: [2.0, 12.0]
  p_stack: 0.0              # multi-line composition of 2..stack_max formulas (dataset.py)
  stack_max: 3
  stack_gap: 0.6
  stack_style: l            # l: left-aligned lines, array{l} | rl: aligned at the relation, array{r l} | rows: partners are whole array{r l} blocks, rows merged
  p_font: 0.0               # per sample and epoch: probability of one of font_variants instead of the original image
  font_variants: []         # row-aligned train copies in other fonts (data dir), scripts/fonts/build_font_variants.py
  p_raster: 0.0             # rasterization: resample down by raster_scale and back up (screen captures, low DPI)
  raster_scale: [0.35, 0.8]
  p_gamma: 0.0              # intensity power exp(U(-r, r)) (stroke weight)
  gamma_log_range: 0.7
  p_jpeg: 0.0               # JPEG at a quality in jpeg_quality
  jpeg_quality: [30, 90]

train:
  epochs: 15
  optimizer: adamw        # adamw | muon (optim.py; Muon shares lr/wd via the Moonshot RMS match)
  muon_momentum: 0.95
  muon_scope: all          # all | backbone (CNN only) | transformer (everything but the CNN)
  lr: 3.0e-4
  weight_decay: 0.05
  warmup_steps: 2000
  min_lr_ratio: 0.02
  label_smoothing: 0.1
  count_loss: 0.0          # weight of the Poisson symbol-count loss
  token_dropout: 0.0       # share of teacher-forced input tokens replaced by <unk>
  init_from: null          # checkpoint whose model weights initialize this run (curriculum)
  feedback_lr_mult: 1.0    # LR multiplier of the attention-feedback tables (ring bias, coverage)
  ema_decay: 0.0           # > 0: EMA of the weights, validated and deployed (best.pt, inference)
  soft_targets: null       # .npz from scripts/soft_targets.py: smoothing mass goes to these per-position targets
  soft_weight: 0.1
  soft_mode: replace         # replace: smoothing mass -> soft targets; alt: + soft_weight x CE on neighbours' alternatives
  mtp: []                  # multi-token prediction without parameters: weights of tokens t+2, t+3, ... on the same logits
  mtp_until: 0.67          # the mtp weights fade linearly to zero by this share of the run
  grad_clip: 1.0
  amp: true                # bf16 autocast for training; evaluation is fp32
  pixel_budget: 1000000    # images per batch = min(max_batch, budget // (H*W))
  max_batch: 64
  workers: 4
  log_every: 100
  max_steps_per_epoch: null
  stop_after_epoch: null   # pause after this epoch (schedule unchanged); continue with --resume
  val_decode_samples: 2000
  eval_pixel_budget: 2000000
  eval_max_batch: 64
