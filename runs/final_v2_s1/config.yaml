data:
  out_dir: data/processed
  cache_dir: ~/.cache/mathocr
  oleehyo_shards:
  - 0
  - 1
  - 2
  - 3
  - 4
  - 5
  oleehyo_train_size: 150000
  oleehyo_val_permille: 15
  oleehyo_test_permille: 15
  max_tokens: 254
  train_max_tokens: null
  min_token_freq: 10
  min_fit_ratio: 0.6
  workers: 4
image:
  target_glyph_px: 18.0
  max_h: 384
  max_w: 1536
  margin: 8
  multiple: 32
  min_scale: 0.1
  max_scale: 4.0
model:
  cnn_channels:
  - 64
  - 128
  - 256
  - 384
  cnn_blocks:
  - 2
  - 2
  - 2
  - 2
  d_model: 512
  n_heads: 8
  enc_layers: 3
  dec_layers: 6
  ff_mult: 4
  dropout: 0.1
  max_len: 512
  encoder: transformer
  local_expansion: 1.5
  sort_window: 32
  attn_kernel: triton
  count_head: false
  count_feed: false
  ring_bias: false
  coverage: false
  feedback_rings: 6
  deform_layers: 0
  enc_stride: 8x4
  rings: false
  inject: false
  depth_pos: false
  coarse: 1
  fovea: false
  fovea_layer: 3
  fovea_levels: 5
  fovea_size: 8
  fovea_base: 2.0
  fovea_channels: 64
augment:
  scale_log_range: 0.29
  p_blur: 0.25
  blur_sigma:
  - 0.3
  - 0.9
  p_stroke: 0.25
  p_contrast: 0.3
  p_noise: 0.25
  noise_std:
  - 2.0
  - 12.0
  p_stack: 0.1
  stack_max: 3
  stack_gap: 0.6
  stack_style: rl
train:
  epochs: 5
  optimizer: muon
  muon_momentum: 0.95
  muon_scope: all
  lr: 0.0006
  weight_decay: 0.05
  warmup_steps: 2000
  min_lr_ratio: 0.02
  label_smoothing: 0.1
  count_loss: 0.0
  token_dropout: 0.0
  init_from: null
  feedback_lr_mult: 1.0
  grad_clip: 1.0
  amp: true
  pixel_budget: 1000000
  max_batch: 64
  workers: 4
  log_every: 100
  max_steps_per_epoch: null
  stop_after_epoch: null
  val_decode_samples: 2000
  eval_pixel_budget: 2000000
  eval_max_batch: 64
