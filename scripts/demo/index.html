<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MathOCR demo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --ink: #16181d; --mute: #5d6370; --line: #d9dce3; --accent: #2457d6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111317; --card: #1a1d23; --ink: #e8eaef; --mute: #9aa1ad; --line: #2c313a; --accent: #6d95ff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--mute); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  #drop { border: 2px dashed var(--line); border-radius: 10px; padding: 28px; text-align: center; color: var(--mute); cursor: pointer; }
  #drop.over { border-color: var(--accent); color: var(--accent); }
  #stage { display: none; max-height: 60vh; }
  #stage img { display: block; max-width: 100%; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
  button, select { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  #render { min-height: 60px; overflow-x: auto; padding: 8px 0; font-size: 1.25em; }
  textarea { width: 100%; min-height: 72px; font: 14px/1.4 ui-monospace, Consolas, monospace; padding: 10px; border-radius: 8px;
             border: 1px solid var(--line); background: var(--bg); color: var(--ink); resize: vertical; }
  .meta { color: var(--mute); font-size: 13px; }
  .err { color: #d33; }
</style>
</head>
<body>
<main>
  <h1>MathOCR: formula image to LaTeX</h1>
  <p class="sub">43M-parameter encoder-decoder. Paste (Ctrl+V), drop or choose an image, crop the formula, press Read.</p>

  <div class="card">
    <div id="drop">Paste an image (Ctrl+V), drop it here, or click to choose a file</div>
    <input id="file" type="file" accept="image/*" hidden>
    <div id="stage"><img id="img" alt=""></div>
    <div class="row">
      <label class="meta" for="model">model</label> <select id="model"></select>
      <button id="read" class="primary" disabled>Read formula</button>
      <button id="whole" disabled>Whole image</button>
      <button id="other" disabled>Another image</button>
      <span id="status" class="meta"></span>
    </div>
  </div>

  <div class="card">
    <div id="render" class="meta">The rendered formula appears here.</div>
    <textarea id="latex" spellcheck="false" placeholder="LaTeX"></textarea>
    <div class="row">
      <button id="copy" disabled>Copy LaTeX</button>
      <label class="meta"><input id="raw" type="checkbox"> model tokens (space-separated)</label>
    </div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let cropper = null, last = null;

fetch("/models").then(r => r.json()).then(names => {
  for (const n of names) { const o = document.createElement("option"); o.textContent = n; $("model").appendChild(o); }
});

function load(file) {
  if (!file || !file.type.startsWith("image/")) return;
  const reader = new FileReader();
  reader.onload = () => {
    $("img").src = reader.result;
    $("drop").style.display = "none";
    $("stage").style.display = "block";
    if (cropper) cropper.destroy();
    cropper = new Cropper($("img"), { viewMode: 1, autoCropArea: 1, background: false, zoomOnWheel: false });
    for (const b of ["read", "whole", "other"]) $(b).disabled = false;
    $("status").textContent = "";
  };
  reader.readAsDataURL(file);
}

$("drop").onclick = () => $("file").click();
$("file").onchange = (e) => load(e.target.files[0]);
$("drop").ondragover = (e) => { e.preventDefault(); $("drop").classList.add("over"); };
$("drop").ondragleave = () => $("drop").classList.remove("over");
$("drop").ondrop = (e) => { e.preventDefault(); $("drop").classList.remove("over"); load(e.dataTransfer.files[0]); };
window.addEventListener("paste", (e) => {
  for (const item of e.clipboardData.items) if (item.type.startsWith("image/")) { load(item.getAsFile()); break; }
});
$("whole").onclick = () => cropper && cropper.reset();
$("other").onclick = () => {
  if (cropper) { cropper.destroy(); cropper = null; }
  $("stage").style.display = "none"; $("drop").style.display = "block"; $("file").value = "";
  for (const b of ["read", "whole", "other"]) $(b).disabled = true;
};

function show() {
  if (!last) return;
  const text = $("raw").checked ? last.latex : last.compact;
  $("latex").value = text;
  try { katex.render(last.latex, $("render"), { displayMode: true, throwOnError: false }); $("render").classList.remove("meta"); }
  catch (e) { $("render").textContent = String(e); }
}
$("raw").onchange = show;

$("read").onclick = async () => {
  if (!cropper) return;
  const canvas = cropper.getCroppedCanvas({ fillColor: "#fff", maxWidth: 4096, maxHeight: 4096, imageSmoothingQuality: "high" });
  $("read").disabled = true; $("status").textContent = "reading...";
  try {
    const r = await fetch("/predict", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ image: canvas.toDataURL("image/png"), model: $("model").value }) });
    const out = await r.json();
    if (out.error) throw new Error(out.error);
    last = out; show();
    $("copy").disabled = false;
    $("status").textContent = `${out.ms} ms, ${out.size[0]}x${out.size[1]} px, model ${$("model").value}`;
  } catch (e) {
    $("status").innerHTML = `<span class="err">${e.message}</span>`;
  } finally { $("read").disabled = false; }
};
document.addEventListener("keydown", (e) => { if (e.key === "Enter" && !$("read").disabled && document.activeElement !== $("latex")) $("read").click(); });
$("copy").onclick = async () => { await navigator.clipboard.writeText($("latex").value); $("status").textContent = "copied"; };
</script>
</body>
</html>
