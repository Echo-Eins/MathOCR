[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mathocr"
version = "0.1.0"
description = "Deterministic image-to-LaTeX recognition of printed mathematical formulas"
requires-python = ">=3.12"
dependencies = [
  "torch>=2.6",
  "numpy",
  "scipy",
  "pillow",
  "pyarrow",
  "pyyaml",
  "huggingface_hub",
  "editdistance",
  "sacrebleu>=2.4",
  "tensorboard",
]

[project.scripts]
mathocr-build-data = "mathocr.data.build:main"
mathocr-train = "mathocr.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src", "tests"]
